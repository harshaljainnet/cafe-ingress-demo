<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brew &amp; Bite Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 18h28v10a12 12 0 0 1-12 12h-4A12 12 0 0 1 8 28V18z"/>
        <path d="M36 21h3a5 5 0 0 1 0 10h-4"/>
        <path d="M15 5c-2 3 2 4 0 8M22 5c-2 3 2 4 0 8M29 5c-2 3 2 4 0 8"/>
      </svg>
      <div>
        <h1>Brew &amp; Bite</h1>
        <p>Fresh coffee, snacks and sweet things</p>
      </div>
    </div>
    <span class="live"><i></i>Open today</span>
  </header>

  <main class="wrap">
    <div class="content">

      <section>
        <div class="sec-head">
          <h2>Today's offers</h2>
          <span class="chip" id="offers-pod"></span>
        </div>
        <div id="offers" class="offers"><p class="state">Loading offers...</p></div>
      </section>

      <section>
        <div class="sec-head">
          <h2>Menu</h2>
          <span class="chip" id="menu-pod"></span>
        </div>
        <div id="tabs" class="tabs"></div>
        <div id="menu-grid" class="grid"><p class="state">Loading menu...</p></div>
      </section>

    </div>
  </main>

  <footer>Demo app for the Kubernetes Ingress video &middot; UI on nginx &middot; APIs on .NET 10</footer>

  <!-- Hidden by default. Open with the small button (bottom-right) or press N. Close with X or Esc. -->
  <button id="net-toggle" class="net-toggle" type="button" aria-expanded="false" aria-controls="net-panel">Network calls</button>

  <aside id="net-panel" class="panel" aria-hidden="true">
    <div class="panel-head">
      <h3>Network calls</h3>
      <button id="net-close" class="icon-btn" type="button" aria-label="Close">&times;</button>
    </div>
    <p class="hint">Browser &rarr; Ingress &rarr; Service &rarr; Pod. Click the button and watch the pod names change.</p>
    <button id="refresh" class="send" type="button">Send 6 requests</button>
    <div id="tally" class="tally"></div>
    <ul id="log" class="log"></ul>
  </aside>

  <script src="app.js"></script>
</body>
</html>
