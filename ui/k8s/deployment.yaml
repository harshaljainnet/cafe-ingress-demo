apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-ui
  labels:
    app: cafe-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cafe-ui
  template:
    metadata:
      labels:
        app: cafe-ui
    spec:
      containers:
        - name: cafe-ui
          image: cafe-ui:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
