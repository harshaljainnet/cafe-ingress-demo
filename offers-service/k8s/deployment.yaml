apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-offers
  labels:
    app: cafe-offers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cafe-offers
  template:
    metadata:
      labels:
        app: cafe-offers
    spec:
      containers:
        - name: cafe-offers
          image: cafe-offers:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
